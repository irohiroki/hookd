server:
  host: "0.0.0.0"
  port: 9000

log:
  file: /home/rocky/hookd/hookd.log
  level: INFO
  max_bytes: 10485760
  backup_count: 5

routes_dir: /home/rocky/hookd/routes.d

env_groups: {}
# Named env var sets that routes and schedules opt into with `env_group: <name>`
# (a single name or a list). Weaker than per-route/per-schedule `env:`.
# Reloaded on SIGHUP / `systemctl reload hookd` — no restart needed.
# Example (Bedrock credential proxy — see DEPLOY.md):
#
#  env_groups:
#    bedrock:
#      CLAUDE_CODE_USE_BEDROCK: "1"
#      HTTPS_PROXY: "http://127.0.0.1:8888"
#      NODE_EXTRA_CA_CERTS: /etc/bedrock-proxy/ca.crt
#      AWS_BEARER_TOKEN_BEDROCK: dummy
#      AWS_DEFAULT_REGION: ap-northeast-1
#      NO_PROXY: "googleapis.com,.googleapis.com"   # every non-AWS destination, both cases
#      no_proxy: "googleapis.com,.googleapis.com"

routes: []
# Example route:
#
#  - path: /deploy/my-app
#    secret: ""                      # shared passphrase for signature verification; omit to skip
#    script: /home/rocky/scripts/deploy.sh
#    async: true                     # true = fire-and-forget (always responds 202); default: false
#    timeout: 60                     # seconds; ignored when async: true; default: 30
#    match:                          # all conditions must match; omit to match any payload
#      ref: "refs/heads/main"
#    env_group: bedrock              # opt into a named env group (see env_groups)
#    env:                            # extra env vars forwarded to the script
#      APP_ENV: production

schedules: []
# Example schedule:
#
#  - name: daily-cleanup
#    cron: '0 3 * * *'              # daily at 03:00 UTC
#    script: /home/rocky/scripts/cleanup.sh
#    timeout: 120                   # default: 30
#    env_group: bedrock             # opt into a named env group (see env_groups)
#    env:
#      TARGET_DIR: /var/log/app
